<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Card CS kmitl</title>
  </head>
  <style>
    /* ================================================
   = Step 1.1 : Custom your card's color! =
   ================================================ */
    .section-1 {
      background: orange;
    }

    /* ================================================
   = Step 3 : Custom your gradient color! =
   ================================================ */

    .section-3 {
      background-image: linear-gradient(
        90deg,
        rgba(255, 101, 1, 1) 6%,
        rgba(255, 247, 0, 1) 30%,
        rgba(255, 101, 1, 1) 90%
      );
    }
  </style>

  <body>
    <div id="card">
      <div class="section-1">

    <!-- ================================================
     = Step 1.1 : Insert your profile picture! =
     ================================================ -->
        <div class="imageProfile">
          <p>image</p>
          <img src="" alt="" />
        </div>

    <!-- ================================================
     = Step 1.2 : Insert your school logo! =
     ================================================ -->
        <div class="section-logo">
          <div class="Mylogo">
            <p>logo</p>

            <img src="" alt="" />
          </div>

     <!-- ================================================
     = Step 1.3 : Change your school abbreviation! =
     ================================================ -->
          <div class="school">
            <h4>KMITL</h4>
          </div>
        </div>
      </div>

    <!-- ================================================
     = Step 2.1 : Fill in your name (TH & EN)! =
    ================================================ -->

      <div class="section-2">
        <div class="name">
          <h4>NameTH :</h4>
          <h5>NameEN :</h5>
        </div>
    
    <!-- ================================================
     = Step 2.2 : Fill in your faculty / school name! =
     ================================================ -->
        <div class="line"></div>
        <h3>School of .....</h3>

        <div class="city"></div>
      </div>

  
      <div class="section-3">LOVE CS</div>
    </div>

    <div class="cskmitl"></div>
  </body>
</html>
