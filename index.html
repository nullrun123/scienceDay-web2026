<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Card CS kmitl</title>
    
  </head>
  <style>

  /* Step 1: Custom your card's color */
  .section-1{
     background: orange;
  }

  
  .section-3{
    background-image: linear-gradient(
    90deg,
    rgba(255, 101, 1, 1) 6%,
    rgba(255, 247, 0, 1) 30%,
    rgba(255, 101, 1, 1) 90%
  );
  }


</style>


  <body>
    <div id="card">

      <!-- section-1 -->
      <div class="section-1">

        <div class="imageProfile">
          <p>image</p>
          
          <!-- ใส่รูปให้หน่อยจิ -->
          <img src="" alt="" />
        </div>

        <div class="section-logo">

          <!-- ใส่รูปให้หน่อยจิ -->
          <div class="Mylogo">
            <p>logo</p>
            <img src="" alt="" />
          </div>

          <!-- ชื่อย่อโรงเรียนตัวเอง -->
          <div class="school">
            <h4>KMITL</h4>
          </div>
        </div>
      </div>

      <!-- section-2 -->
       <!-- ใส่ชื่อตัวเอง Thai และ English ต่อใน h4 เลย -->
      <div class="section-2">
        <div class="name">
          <h4>NameTH :  </h4>
          <h5>NameEN :  </h5>
        </div>
        
        <div class="line"></div>
        <h3>School of .....</h3>

        <div class="city"></div>
      </div>


      <!-- section-3 custom gradient style-->
      <div class="section-3">
        LOVE CS
      </div>
    </div>

    <div class="giri"></div>
  </body>
</html>
